{% extends "base.html" %}
{% block title %}Задачи{% endblock %}
{% block body %}
<h1>Задачи</h1>
<div class="grid-2">
  <section class="card">
    <h2>Создать</h2>
    <form method="post" action="/tasks" class="stack">
      <input name="title" placeholder="Заголовок" required>
      <textarea name="description" rows="4" placeholder="Описание"></textarea>
      <input name="assigned_to" placeholder="Telegram ID сотрудника (необязательно)">
      <button>Добавить</button>
    </form>
  </section>
  <section class="card">
    <h2>Список</h2>
    {% for t in items %}
    <div class="mentor-row">
      <div>
        <b>#{{ t.id }} {{ t.title }}</b>
        <span>{% if t.assigned_to %}→ {{ t.assigned_to }} · {% endif %}{{ t.description }}</span>
      </div>
      <form method="post" action="/tasks/{{ t.id }}/status">
        <select name="status" onchange="this.form.submit()">
          <option value="open" {% if t.status=='open' %}selected{% endif %}>open</option>
          <option value="in_progress" {% if t.status=='in_progress' %}selected{% endif %}>in_progress</option>
          <option value="done" {% if t.status=='done' %}selected{% endif %}>done</option>
          <option value="cancelled" {% if t.status=='cancelled' %}selected{% endif %}>cancelled</option>
        </select>
      </form>
    </div>
    {% else %}
    <p class="empty">Задач нет</p>
    {% endfor %}
  </section>
</div>
{% endblock %}

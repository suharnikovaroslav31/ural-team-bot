<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Shah Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login">
    <div class="brand-mark xl">UT</div>
    <h1>SHAH TEAM</h1>
    <p>Внутренняя панель учёта задач и выплат</p>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <label>Пароль администратора</label>
    <input type="password" name="password" autofocus required>
    <button type="submit">Войти</button>
    <p class="hint">Сотрудникам пароль не нужен — ссылка кабинета приходит из бота командой /web</p>
  </form>
</body>
</html>
